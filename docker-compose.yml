services:

  # ── Background scanner — all available CPU/memory ───────────────────────────
  # dashboard service removed; scanner now owns all resources
  scanner:
    build: .
    image: axiom-terminal:latest
    container_name: axiom-scanner
    command: python -u scanner_loop.py
    restart: always                          # hard restart (not unless-stopped)
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - axiom-data:/app/data/persistent
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Telegram admin terminal ──────────────────────────────────────────────────
  telegram-bot:
    build:
      context: ./axiom-telegram-bot
      dockerfile: Dockerfile
    image: axiom-telegram-bot:latest
    container_name: axiom-telegram-bot
    restart: always
    env_file: .env
    environment:
      PROJECT_DIR: /project               # host project root inside container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # docker CLI access for /logs /restart /status
      - /home/ubuntu/axiom:/project:rw              # project filesystem for /files /read /edit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  axiom-data:
    name: axiom-data
