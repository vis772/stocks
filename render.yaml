# render.yaml — Axiom Terminal (Render Blueprint)
#
# Three services sharing a Supabase PostgreSQL database:
#   1. axiom-dashboard   — Streamlit web UI  (Web Service)
#   2. axiom-scanner     — Background loop   (Background Worker)
#   3. axiom-telegram-bot — Claude agent bot (Background Worker)
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Secret env vars (marked sync: false) must be set manually in each
# service's Environment tab after the first deploy.
#
# Docs: https://render.com/docs/blueprint-spec

envVarGroups:
  # Shared across dashboard + scanner (telegram bot has its own minimal set)
  - name: axiom-core
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase connection string (postgres://...)
      - key: FINNHUB_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: PUSHOVER_API_TOKEN
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: AXIOM_QUANT_MODE
        value: "1"
      - key: ANTHROPIC_HAIKU_MODEL
        value: "claude-haiku-4-5-20251001"

services:

  # ── Service 1: Streamlit Dashboard ─────────────────────────────────────────
  - type: web
    name: axiom-dashboard
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection false
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - fromGroup: axiom-core

  # ── Service 2: Background Scanner Loop ─────────────────────────────────────
  - type: worker
    name: axiom-scanner
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scanner_loop.py
    autoDeploy: true
    envVars:
      - fromGroup: axiom-core
      - key: AXIOM_TEST_SCAN
        value: "0"           # Set to "1" temporarily to force a scan outside market hours

  # ── Service 3: Telegram Bot ─────────────────────────────────────────────────
  - type: worker
    name: axiom-telegram-bot
    env: python
    plan: starter
    region: oregon
    rootDir: axiom-telegram-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5-20251001"
