# =============================================================================
# Axiom Terminal — Nginx reverse proxy
# Forwards HTTP :80  →  Streamlit :8501
# Streamlit requires WebSocket support (--server.headless=true)
# =============================================================================

upstream streamlit {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or EC2 public DNS / IP
    server_name _;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/axiom_access.log;
    error_log  /var/log/nginx/axiom_error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy to Streamlit ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://streamlit;

        # Use HTTP/1.1 so the Upgrade header works for WebSockets
        proxy_http_version 1.1;

        # WebSocket upgrade headers (required by Streamlit)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Standard reverse-proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — Streamlit keeps long-lived WS connections open
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;

        # Disable buffering so streaming responses reach the browser immediately
        proxy_buffering off;
    }

    # ── Static asset caching (Streamlit serves its own static files) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass       http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public, max-age=604800, immutable";
    }
}
